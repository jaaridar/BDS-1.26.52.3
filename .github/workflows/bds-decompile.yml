name: BDS worldgen decompile

# Static, read-only analysis of the official (proprietary) bedrock_server.
#
# The repository normally contains only a Git LFS pointer for the binary, so the
# analysis runs on GitHub runners where the LFS object can be materialised.
# Nothing here executes the target: stage 1 recovers ELF/RTTI/string structure,
# stage 2 runs Ghidra's decompiler over the ranked world-generation functions.
# Generated artefacts are proprietary research evidence under
# research/proprietary/ - they are NOT MIT-licensed OpenBDS source.
on:
  workflow_dispatch:
    inputs:
      budget_seconds:
        description: Decompiler wall-clock budget per shard
        required: false
        default: "3300"
      max_functions:
        description: Maximum functions per shard
        required: false
        default: "900"
  push:
    paths:
      - .github/workflows/bds-decompile.yml
      - tools/binary-analysis/**

permissions:
  contents: write

concurrency:
  group: bds-decompile-${{ github.ref }}
  cancel-in-progress: false

env:
  BINARY_SHA256: 0a490c711d4a2ce075debcd979e8862b7eaba008373f9970f0edbb67f98f9207
  EVIDENCE: research/proprietary/bds-1.26.52.3/worldgen
  GHIDRA_URL: https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip
  GHIDRA_SHA256: ddac49f903da9d5bac833e5cc79395098b9c33cfd3279be5f31bd00387d2d4db

jobs:
  triage:
    if: startsWith(github.ref, 'refs/heads/arena/')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      # The 256 MB LFS object has a monthly bandwidth quota, so the binary is
      # restored from the Actions cache whenever possible and only fetched via
      # LFS on a cache miss.
      - id: checkout
        name: Check out repository (LFS pointer, not the object)
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - id: restore
        name: Restore the materialised binary from cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: bedrock_server
          key: bds-binary-${{ env.BINARY_SHA256 }}
          fail-on-cache-miss: false

      - id: materialise
        name: Fall back to Git LFS if the cache missed
        continue-on-error: true
        run: |
          set -eu
          if [ "$(stat -c%s bedrock_server 2>/dev/null || echo 0)" -lt 100000000 ]; then
            git lfs pull --include=bedrock_server
          fi
          echo "$BINARY_SHA256  bedrock_server" | sha256sum --check --strict

      - id: cache
        name: Cache the binary for later runs
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: bedrock_server
          key: bds-binary-${{ env.BINARY_SHA256 }}

      - id: pip
        name: Install static-analysis dependencies
        continue-on-error: true
        run: |
          python3 -m pip install --quiet --break-system-packages capstone pyelftools
          python3 -c "import capstone, elftools; print('capstone', capstone.__version__)"

      - id: triage
        name: Stage 1 - ELF, RTTI/vtable and string-xref triage (never executes the target)
        continue-on-error: true
        run: |
          set -eu
          mkdir -p "$EVIDENCE/triage"
          extra=()
          if [ -f "$EVIDENCE/next-targets.tsv" ]; then
            extra=(--extra-targets "$EVIDENCE/next-targets.tsv")
          fi
          python3 tools/binary-analysis/triage.py bedrock_server "$EVIDENCE/triage" \
            --expected-sha256 "$BINARY_SHA256" \
            --max-targets 3600 "${extra[@]}"
          sed -n '1,40p' "$EVIDENCE/triage/summary.md" || true

      - id: java
        name: Select JDK 21
        continue-on-error: true
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - id: ghidra
        name: Install verified Ghidra 12.1.4 release
        continue-on-error: true
        run: |
          curl --fail --location --retry 3 --progress-bar "$GHIDRA_URL" -o "$RUNNER_TEMP/ghidra.zip"
          echo "$GHIDRA_SHA256  $RUNNER_TEMP/ghidra.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/ghidra.zip" -d "$RUNNER_TEMP"
          ln -sfn "$RUNNER_TEMP/ghidra_12.1.4_PUBLIC" "$RUNNER_TEMP/ghidra"

      - id: javac
        name: Pre-flight compile check of the headless scripts
        continue-on-error: true
        run: |
          set -eu
          classpath="$(find "$RUNNER_TEMP/ghidra/Ghidra" -name '*.jar' -printf '%p:' | tr -d '\n')"
          mkdir -p "$RUNNER_TEMP/scriptcheck"
          javac -nowarn -proc:none -cp "$classpath" -d "$RUNNER_TEMP/scriptcheck" \
            tools/binary-analysis/ghidra/DecompileTargets.java
          echo "headless scripts compile cleanly"

      - id: smoke
        name: End-to-end self-test on the synthetic worldgen fixture
        continue-on-error: true
        run: |
          set -u
          mkdir -p "$EVIDENCE/smoke" "$RUNNER_TEMP/smokeproj"
          g++ -O1 -fno-inline -g0 -fPIE -pie -o "$RUNNER_TEMP/fixture" \
            tools/binary-analysis/fixtures/worldgen_fixture.cpp
          strip -s "$RUNNER_TEMP/fixture"
          python3 tools/binary-analysis/triage.py "$RUNNER_TEMP/fixture" \
            "$EVIDENCE/smoke/triage" --max-targets 40 2>&1 | tee "$EVIDENCE/smoke/triage.log"
          text_vaddr="$(awk '$1==".text"{print $2}' "$EVIDENCE/smoke/triage/sections.txt")"
          echo "fixture .text vaddr: $text_vaddr" | tee -a "$EVIDENCE/smoke/triage.log"
          "$RUNNER_TEMP/ghidra/support/analyzeHeadless" \
            "$RUNNER_TEMP/smokeproj" smoke \
            -import "$RUNNER_TEMP/fixture" -overwrite -noanalysis \
            -scriptPath "$GITHUB_WORKSPACE/tools/binary-analysis/ghidra" \
            -postScript DecompileTargets.java "$GITHUB_WORKSPACE/$EVIDENCE/smoke/out" \
                "$GITHUB_WORKSPACE/$EVIDENCE/smoke/triage/targets.tsv" 180 40 \
                "$GITHUB_WORKSPACE/$EVIDENCE/smoke/triage/worldgen-vtables.tsv" "$text_vaddr" \
            -deleteProject > "$EVIDENCE/smoke/headless.txt" 2>&1
          echo "$?" > "$EVIDENCE/smoke/exit-status.txt"
          cat "$EVIDENCE/smoke/out/diagnostics.txt" 2>/dev/null || true
          # The fixture's world-generation function must decompile with its
          # string constants attached; this validates the ELF -> Ghidra address
          # mapping as well as RTTI/vtable/strinx-xref recovery.
          hits="$(grep -l "minecraft:noise_settings" "$EVIDENCE/smoke/out/functions/"*.c 2>/dev/null | wc -l)"
          echo "fixture worldgen string hits: $hits" | tee -a "$EVIDENCE/smoke/triage.log"
          classes="$(grep -c "OverworldGeneratorMultinoise\|BiomeSource" "$EVIDENCE/smoke/triage/interesting-classes.tsv" || true)"
          echo "fixture worldgen classes: $classes" | tee -a "$EVIDENCE/smoke/triage.log"
          test -s "$EVIDENCE/smoke/out/index.md"
          test "$hits" -ge 1
          test "$classes" -ge 2

      - name: Record per-step outcomes
        if: always()
        run: |
          set -u
          mkdir -p "$EVIDENCE"
          {
            echo "run: ${GITHUB_RUN_ID}  ref: ${GITHUB_REF_NAME}"
            echo "checkout:    ${{ steps.checkout.outcome }}"
            echo "restore:     ${{ steps.restore.outcome }}"
            echo "materialise: ${{ steps.materialise.outcome }}"
            echo "cache:       ${{ steps.cache.outcome }}"
            echo "pip:         ${{ steps.pip.outcome }}"
            echo "triage:      ${{ steps.triage.outcome }}"
            echo "java:        ${{ steps.java.outcome }}"
            echo "ghidra:      ${{ steps.ghidra.outcome }}"
            echo "javac:       ${{ steps.javac.outcome }}"
            echo "smoke:       ${{ steps.smoke.outcome }}"
            echo "binary bytes: $(stat -c%s bedrock_server 2>/dev/null || echo 0)"
            echo
            echo "--- triage summary head ---"
            head -30 "$EVIDENCE/triage/summary.md" 2>/dev/null || true
            echo
            echo "--- smoke diagnostics ---"
            cat "$EVIDENCE/smoke/out/diagnostics.txt" 2>/dev/null || echo "smoke did not run"
            echo
            echo "--- smoke headless tail ---"
            tail -40 "$EVIDENCE/smoke/headless.txt" 2>/dev/null || true
          } > "$EVIDENCE/triage/runbook.txt"
          cat "$EVIDENCE/triage/runbook.txt"

      - name: Publish triage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: triage-data
          path: research/proprietary/bds-1.26.52.3/worldgen/triage
          retention-days: 14

      - name: Publish smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke
          path: research/proprietary/bds-1.26.52.3/worldgen/smoke
          retention-days: 14

      - name: Fail this job if triage or the smoke test failed
        if: always()
        run: |
          set -eu
          test -s "$EVIDENCE/triage/targets.tsv"
          test -s "$EVIDENCE/smoke/out/index.md"
          grep -q "image bias (program - ELF): 0x" "$EVIDENCE/smoke/out/diagnostics.txt"

  decompile:
    needs: triage
    if: startsWith(github.ref, 'refs/heads/arena/')
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      SHARD: ${{ matrix.shard }}
      SHARDS: '4'
      BUDGET: ${{ github.event.inputs.budget_seconds || '3300' }}
      MAXFN: ${{ github.event.inputs.max_functions || '900' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Restore the cached binary
        uses: actions/cache/restore@v4
        with:
          path: bedrock_server
          key: bds-binary-${{ env.BINARY_SHA256 }}
          fail-on-cache-miss: false

      - name: Materialise the binary if the cache missed
        run: |
          set -eu
          if [ "$(stat -c%s bedrock_server)" -lt 100000000 ]; then
            git lfs pull --include=bedrock_server
          fi
          echo "$BINARY_SHA256  bedrock_server" | sha256sum --check --strict

      - name: Fetch triage results for this run
        uses: actions/download-artifact@v4
        with:
          name: triage-data
          path: research/proprietary/bds-1.26.52.3/worldgen/triage

      - name: Shard the ranked target list
        run: |
          python3 - "$SHARD" "$SHARDS" <<'PY'
          import sys
          shard, shards = int(sys.argv[1]), int(sys.argv[2])
          src = "research/proprietary/bds-1.26.52.3/worldgen/triage/targets.tsv"
          dst = "shard-targets.tsv"
          with open(src) as handle, open(dst, "w") as out:
              lines = handle.read().splitlines()
              out.write(lines[0] + "\n")
              for index, line in enumerate(lines[1:]):
                  if index % shards == shard:
                      out.write(line + "\n")
          print("shard", shard, "targets:", sum(1 for _ in open(dst)) - 1)
          PY

      - name: Select JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install verified Ghidra 12.1.4 release
        run: |
          curl --fail --location --retry 3 --progress-bar "$GHIDRA_URL" -o "$RUNNER_TEMP/ghidra.zip"
          echo "$GHIDRA_SHA256  $RUNNER_TEMP/ghidra.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/ghidra.zip" -d "$RUNNER_TEMP"
          ln -sfn "$RUNNER_TEMP/ghidra_12.1.4_PUBLIC" "$RUNNER_TEMP/ghidra"

      - name: Stage 2 - headless Ghidra decompilation
        env:
          MAXMEM: 8G
        run: |
          out="$GITHUB_WORKSPACE/$EVIDENCE/decompiled/shard-$SHARD"
          rm -rf "$out" "$RUNNER_TEMP/project"
          mkdir -p "$out" "$RUNNER_TEMP/project"
          text_vaddr="$(awk '$1==".text"{print $2}' "$EVIDENCE/triage/sections.txt")"
          echo "ELF .text vaddr: $text_vaddr"
          set +e
          "$RUNNER_TEMP/ghidra/support/analyzeHeadless" \
            "$RUNNER_TEMP/project" "bds-shard-$SHARD" \
            -import "$GITHUB_WORKSPACE/bedrock_server" \
            -overwrite -noanalysis \
            -scriptPath "$GITHUB_WORKSPACE/tools/binary-analysis/ghidra" \
            -postScript DecompileTargets.java "$out" \
                "$GITHUB_WORKSPACE/shard-targets.tsv" "$BUDGET" "$MAXFN" \
                "$GITHUB_WORKSPACE/$EVIDENCE/triage/worldgen-vtables.tsv" "$text_vaddr" \
            -deleteProject > "$out/headless.txt" 2>&1
          echo "$?" > "$out/headless-exit-status.txt"
          set -e
          tail -30 "$out/headless.txt" || true
          {
            echo "shard: $SHARD"
            echo "analyzeHeadless exit: $(cat "$out/headless-exit-status.txt")"
            echo "pseudocode files: $(find "$out/functions" -type f 2>/dev/null | wc -l)"
            echo "int3/stub functions: $(grep -l 'swi(3)' "$out"/functions/*.c 2>/dev/null | wc -l)"
            echo "image bias: $(grep -a 'image bias' "$out/headless.txt" | head -1)"
            echo "index present: $([ -s "$out/index.md" ] && echo yes || echo no)"
            echo "targets: $(($(wc -l < shard-targets.tsv) - 1))"
            echo
            echo "--- errors from headless log ---"
            grep -a -E "ERROR|Exception|error|WARN.*script|SCRIPT" "$out/headless.txt" | head -40 || true
            echo
            echo "--- script output ---"
            grep -a "DecompileTargets" "$out/headless.txt" | tail -40 || true
          } > "$out/diagnostics.txt"
          cat "$out/diagnostics.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shard-${{ matrix.shard }}
          path: research/proprietary/bds-1.26.52.3/worldgen/decompiled/shard-${{ matrix.shard }}
          retention-days: 14
          if-no-files-found: warn

  collect:
    needs: [triage, decompile]
    if: always() && startsWith(github.ref, 'refs/heads/arena/')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download every shard (and the triage report)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: "*"
          path: artifacts

      - name: Assemble the evidence tree
        run: |
          set -eu
          mkdir -p "$EVIDENCE"
          if [ -d artifacts/triage-data ]; then
            rm -rf "$EVIDENCE/triage"
            cp -r artifacts/triage-data "$EVIDENCE/triage"
          fi
          if [ -d artifacts/smoke ]; then
            rm -rf "$EVIDENCE/smoke"
            cp -r artifacts/smoke "$EVIDENCE/smoke"
          fi
          for shard in 0 1 2 3 4 5; do
            if [ -d "artifacts/shard-$shard" ]; then
              rm -rf "$EVIDENCE/decompiled/shard-$shard"
              mkdir -p "$EVIDENCE/decompiled"
              cp -r "artifacts/shard-$shard" "$EVIDENCE/decompiled/shard-$shard"
            fi
          done
          {
            echo "collected: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "run: ${GITHUB_RUN_ID}"
            for shard in 0 1 2 3 4 5; do
              dir="$EVIDENCE/decompiled/shard-$shard"
              echo "shard $shard: $([ -d "$dir" ] && echo present || echo missing), \
          functions=$(find "$dir/functions" -type f 2>/dev/null | wc -l), \
          exit=$(cat "$dir/headless-exit-status.txt" 2>/dev/null || echo none)"
            done
            echo
            du -sh "$EVIDENCE" || true
          } | tee "$EVIDENCE/collect-report.txt"

      - name: Merge call graphs and index the recovered corpus
        run: |
          set -eu
          python3 - "$EVIDENCE" <<'PY'
          import glob, os, sys
          root = sys.argv[1]
          rows = {}
          header = None
          for path in sorted(glob.glob(os.path.join(root, "decompiled", "shard-*", "callgraph.tsv"))):
              with open(path, encoding="utf-8", errors="replace") as handle:
                  lines = handle.read().splitlines()
              if lines and header is None:
                  header = lines[0]
              for line in lines[1:]:
                  fields = line.split("\t")
                  if len(fields) < 3:
                      continue
                  key = fields[0]
                  callees = set(filter(None, fields[2].split(","))) if len(fields) > 2 else set()
                  callers = set(filter(None, fields[3].split(","))) if len(fields) > 3 else set()
                  slot = rows.setdefault(key, [fields[1] if len(fields) > 1 else "", set(), set()])
                  slot[1] |= callees
                  slot[2] |= callers
          if rows:
              out = os.path.join(root, "callgraph.tsv")
              with open(out, "w", encoding="utf-8") as handle:
                  handle.write("function\tlabel\tcallees\tcallers\n")
                  for key in sorted(rows, key=lambda value: int(value, 0)):
                      label, callees, callers = rows[key]
                      handle.write("%s\t%s\t%s\t%s\n" % (
                          key, label,
                          ",".join(sorted(callees, key=lambda v: int(v, 0))),
                          ",".join(sorted(callers, key=lambda v: int(v, 0)))))
              print("merged call graph:", len(rows), "functions ->", out)
          PY
          python3 tools/worldgen-data/analyse.py "$EVIDENCE" \
            --top 40 --write-index "$EVIDENCE/data/function-index.tsv" \
            > "$EVIDENCE/coverage.txt"
          cat "$EVIDENCE/coverage.txt"

      - name: Commit the collected evidence
        run: |
          set -eu
          git add -f "$EVIDENCE"
          if git diff --cached --quiet -- "$EVIDENCE"; then
            echo "evidence unchanged"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "research: worldgen triage and decompiled worldgen functions"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            sleep $((attempt * 5))
          done
          exit 1
