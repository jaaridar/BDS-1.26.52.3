name: Worldgen golden capture

# Produces server-authored ground truth for world generation: it runs the
# official bedrock_server with a fixed seed, forces chunk generation, and saves
# the result with the in-game `structure save` command. The output is decoded
# into a canonical block grid and committed under research/proprietary/ as
# verification data (not MIT source).
#
# The server is run headless with cheats enabled and no players; nothing is
# connected to it. The binary is the proprietary release asset, downloaded and
# hash-verified first.

on:
  workflow_dispatch:
    inputs:
      seed:
        description: 'World seed to capture'
        required: false
        default: '1'
      recheck:
        description: 'Re-run the same seed and require a byte-identical capture'
        required: false
        default: 'true'
  push:
    paths:
      - .github/workflows/worldgen-golden.yml
      - tools/worldgen-golden/**

permissions:
  contents: write

concurrency:
  group: worldgen-golden-${{ github.ref }}
  cancel-in-progress: false

env:
  OUTPUT_DIR: research/proprietary/bds-1.26.52.3/golden
  MODE: ${{ github.event.inputs.seed || '1' }}
  # Capture 2048 blocks away from spawn: the spawn area ticks from the moment the
  # world loads, before any rule can be changed, and random ticks let blocks like
  # glow lichen spread and break reproducibility.
  PROBE: 2048,100,2048
  RECHECK: ${{ github.event.inputs.recheck || 'true' }}

jobs:
  capture:
    if: startsWith(github.ref, 'refs/heads/arena/')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The binary is a GitHub release asset (proprietary, not tracked in git).
      # The repository is private, so the download needs the Actions token.
      - name: Fetch the official binary from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.26.52.3 --repo "${GITHUB_REPOSITORY}" \
            --pattern bedrock_server --clobber
          chmod +x bedrock_server
          test "$(stat --printf=%s bedrock_server)" = 256133808
          echo "0a490c711d4a2ce075debcd979e8862b7eaba008373f9970f0edbb67f98f9207  bedrock_server" \
            | sha256sum --check --strict

      - name: Self-test the golden tooling
        run: node tools/worldgen-golden/self-test.js

      - name: Capture the world from the official server
        run: |
          set +e
          node tools/worldgen-golden/run-golden.js \
            --binary ./bedrock_server \
            --seed "${MODE}" \
            --out "capture/seed-${MODE}" \
            --chunk-base 128 128 \
            --timeout 900 \
            --verbose
          status=$?
          echo "CAPTURE_EXIT=$status" >> "$GITHUB_ENV"
          echo "capture exit status: $status"
          exit $status

      # A second capture is needed to MEASURE which blocks the server itself
      # reproduces: its terrain is stable, its decoration features are not.
      - name: Capture the same seed again
        if: ${{ env.RECHECK == 'true' }}
        run: |
          node tools/worldgen-golden/run-golden.js \
            --binary ./bedrock_server \
            --seed "${MODE}" \
            --out "capture/seed-${MODE}-b" \
            --chunk-base 128 128 \
            --timeout 900

      - name: Dump the world databases
        run: |
          npm install --no-save --no-audit --no-fund classic-level
          for suffix in "" "-b"; do
            dir="capture/seed-${MODE}${suffix}"
            [ -d "$dir/server/worlds/golden/db" ] || continue
            node tools/worldgen-golden/dump-db.js \
              --db "$dir/server/worlds/golden/db" \
              --out "$dir/db-dump.json"
            mkdir -p "${OUTPUT_DIR}/db"
            cp "$dir/db-dump.json" "${OUTPUT_DIR}/db/dump-seed-${MODE}${suffix}.json"
          done

      - name: Prove the decoder against the marker probe
        run: |
          node tools/worldgen-golden/check-db.js "capture/seed-${MODE}/db-dump.json" \
            --probe "${PROBE}"

      - name: Build golden columns
        run: |
          # Replace this seed's previous columns: the newly captured set is the
          # one whose reproducibility has been measured.
          rm -f "${OUTPUT_DIR}"/golden-${MODE}-*.blocks.bin \
                "${OUTPUT_DIR}"/golden-${MODE}-*.layer1.bin \
                "${OUTPUT_DIR}"/golden-${MODE}-*.unstable.json \
                "${OUTPUT_DIR}"/golden-${MODE}-*.json
          args=""
          if [ -f "capture/seed-${MODE}-b/db-dump.json" ]; then
            args="--also capture/seed-${MODE}-b/db-dump.json"
          fi
          set +e
          node tools/worldgen-golden/build-golden-db.js \
            "capture/seed-${MODE}/db-dump.json" \
            $args \
            --capture "capture/seed-${MODE}" \
            --probe "${PROBE}" \
            --chunks 128,128 129,128 128,129 129,129 \
            --out "${OUTPUT_DIR}" 2>&1 | tee "capture/build-golden-${MODE}.log"
          exit ${PIPESTATUS[0]}

      # Acceptance test for the oracle itself: a capture that was NOT used to
      # build the golden data must reproduce it exactly (modulo the blocks the
      # server demonstrably does not reproduce).
      - name: Verify an unseen capture against the golden data
        if: ${{ env.RECHECK == 'true' }}
        run: |
          node tools/worldgen-golden/run-golden.js \
            --binary ./bedrock_server \
            --seed "${MODE}" \
            --out "capture/seed-${MODE}-check" \
            --chunk-base 128 128 \
            --timeout 900
          node tools/worldgen-golden/dump-db.js \
            --db "capture/seed-${MODE}-check/server/worlds/golden/db" \
            --out "capture/seed-${MODE}-check/db-dump.json"
          node tools/worldgen-golden/build-golden-db.js \
            "capture/seed-${MODE}-check/db-dump.json" \
            --probe "${PROBE}" \
            --chunks 128,128 129,128 128,129 129,129 \
            --out "capture/golden-${MODE}-check"
          set +e
          node tools/worldgen-golden/verify.js \
            --golden "${OUTPUT_DIR}" \
            --candidate "capture/golden-${MODE}-check" \
            --require-exact \
            --write-report "capture/verify-${MODE}.md" 2>&1 | tee "capture/verify-${MODE}.log"
          status=${PIPESTATUS[0]}
          echo "VERIFY_EXIT=$status" >> "$GITHUB_ENV"
          exit $status

      # Artifacts are not reachable from every environment, so the diagnostics
      # that explain a failure are committed next to the evidence as well.
      - name: Record capture diagnostics
        if: always()
        run: |
          mkdir -p "${OUTPUT_DIR}/diagnostics"
          {
            echo "seed: ${MODE}"
            echo "recheck: ${RECHECK}"
            echo "capture exit: ${CAPTURE_EXIT:-unknown}"
            echo
            echo 'capture files:'
            find capture -maxdepth 3 -type f -printf '%s %p\n' 2>/dev/null | sort -n | tail -40
            echo
            echo 'golden directory:'
            ls -l "${OUTPUT_DIR}" 2>/dev/null || true
            echo
            echo 'server log tail:'
            tail -n 120 "capture/seed-${MODE}/server.log" 2>/dev/null || true
          } > "${OUTPUT_DIR}/diagnostics/report-${MODE}.txt"
          cp "${OUTPUT_DIR}/diagnostics/report-${MODE}.txt" capture/report.txt
          cp "capture/seed-${MODE}/server.log" "${OUTPUT_DIR}/diagnostics/server-${MODE}.log" 2>/dev/null || true
          cp "capture/seed-${MODE}/server-transcript.txt" "${OUTPUT_DIR}/diagnostics/transcript-${MODE}.txt" 2>/dev/null || true
          cp "capture/seed-${MODE}/error.txt" "${OUTPUT_DIR}/diagnostics/error-${MODE}.txt" 2>/dev/null || true
          cp "capture/seed-${MODE}/filesystem.txt" "${OUTPUT_DIR}/diagnostics/filesystem-${MODE}.txt" 2>/dev/null || true
          {
            echo 'structure files found in the working tree:'
            find "capture/seed-${MODE}" -name '*.mcstructure' -printf '%s %P\n' 2>/dev/null | head -40
            echo
            echo 'behaviour-pack structures written by the server:'
            find "capture/seed-${MODE}" -path '*structures*' -name '*.mcstructure' 2>/dev/null | head -5
            echo
            echo 'db dump / decode log:'
            cat "capture/build-golden-${MODE}.log" 2>/dev/null || echo '(none)'
            echo
            echo 'determinism check (re-capture vs golden):'
            cat "capture/verify-${MODE}.log" 2>/dev/null | tail -60 || echo '(not run)'
            echo
            echo 'structure save note:'
            cat "capture/seed-${MODE}/structures-missing.txt" 2>/dev/null | head -5 || true
          } >> "${OUTPUT_DIR}/diagnostics/report-${MODE}.txt"
          cp "capture/seed-${MODE}/capture.json" "${OUTPUT_DIR}/diagnostics/capture-${MODE}.json" 2>/dev/null || true
          cp "capture/verify-${MODE}.md" "${OUTPUT_DIR}/diagnostics/verify-${MODE}.md" 2>/dev/null || true
          cp "capture/verify-${MODE}.log" "${OUTPUT_DIR}/diagnostics/verify-${MODE}.log" 2>/dev/null || true
          cat capture/report.txt

      - name: Upload capture artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worldgen-golden-seed-${{ env.MODE }}
          path: |
            capture/
          retention-days: 30
          if-no-files-found: warn

      - name: Commit golden data to the analysis branch
        if: always()
        run: |
          if [ ! -d "${OUTPUT_DIR}" ]; then
            echo 'no golden output produced'; exit 0
          fi
          git add -f "${OUTPUT_DIR}"
          if git diff --cached --quiet -- "${OUTPUT_DIR}"; then
            echo 'golden data unchanged'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "research: golden worldgen capture for seed ${MODE}"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo 'pushed'; exit 0
            fi
            sleep $((attempt * 5))
          done
          echo 'could not push golden data' >&2
          exit 1
