name: Official binary inventory

# The checked-out repository normally contains only a Git LFS pointer locally.
# This opt-in workflow runs static, bounded analysis on GitHub's runner, where
# actions/checkout can materialize the repository-owned LFS object. It never
# executes bedrock_server.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/official-binary-inventory.yml
      - tools/binary-analysis/inventory.py

permissions:
  contents: write

concurrency:
  group: official-binary-inventory-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inventory:
    if: startsWith(github.ref, 'refs/heads/arena/')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository and proprietary LFS object
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Verify and inventory without executing the target
        run: |
          python3 tools/binary-analysis/inventory.py \
            bedrock_server \
            research/proprietary/bds-1.26.52.3/inventory \
            --expected-sha256 0a490c711d4a2ce075debcd979e8862b7eaba008373f9970f0edbb67f98f9207

      - name: Commit bounded evidence to the analysis branch
        run: |
          git add research/proprietary/bds-1.26.52.3/inventory
          if git diff --cached --quiet -- research/proprietary/bds-1.26.52.3/inventory; then
            echo 'Inventory is unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'research: inventory official BDS worldgen symbols'
          git push origin "HEAD:${GITHUB_REF_NAME}"
