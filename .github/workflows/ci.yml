name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # .npmrc sets ignore-scripts=true: no native RakNet build required
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests (real server + client over loopback)
        run: npm run test:integration

      - name: CLI smoke test
        run: |
          node bin/openbds.js --version
          node bin/openbds.js --help
